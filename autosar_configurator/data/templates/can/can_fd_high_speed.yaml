metadata:
  name: "CAN FD High Speed"
  module: "Can"
  category: "Communication"
  description: "CAN FD controller configuration, interrupt mode (baudrates are set in the CanControllerBaudrateConfig sub-container)"
  version: "1.0"
  author: "AUTOSAR Configurator"
  tags: ["can", "canfd", "communication", "high-speed"]

applicability:
  container_def: "CanConfigSet/CanController"

parameters:
  adjustable:
    - name: "CanControllerId"
      display_name: "Controller ID"
      type: "integer"
      default: 0
      min: 0
      max: 7



    - name: "CanRxProcessing"
      display_name: "RX Processing"
      type: "enumeration"
      default: "INTERRUPT"
      options: ["POLLING", "INTERRUPT", "MIXED"]

    - name: "CanTxProcessing"
      display_name: "TX Processing"
      type: "enumeration"
      default: "INTERRUPT"
      options: ["POLLING", "INTERRUPT", "MIXED"]

  fixed:
    CanControllerActivation: true
    CanFDSupport: true
    CanBusoffProcessing: "INTERRUPT"
