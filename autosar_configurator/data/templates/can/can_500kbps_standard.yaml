metadata:
  name: "CAN 500kbps Standard"
  module: "Can"
  category: "Communication"
  description: "Standard CAN controller configuration at 500kbps with polling mode (baudrate is set in the CanControllerBaudrateConfig sub-container)"
  version: "1.0"
  author: "AUTOSAR Configurator"
  tags: ["can", "communication", "standard", "polling"]

applicability:
  container_def: "CanConfigSet/CanController"

parameters:
  adjustable:

    - name: "CanControllerId"
      display_name: "Controller ID"
      type: "integer"
      default: 0
      min: 0
      max: 7
      description: "Hardware controller ID"

    - name: "CanRxProcessing"
      display_name: "RX Processing"
      type: "enumeration"
      default: "POLLING"
      options: ["POLLING", "INTERRUPT", "MIXED"]
      description: "Receive message processing mode"

    - name: "CanTxProcessing"
      display_name: "TX Processing"
      type: "enumeration"
      default: "POLLING"
      options: ["POLLING", "INTERRUPT", "MIXED"]
      description: "Transmit message processing mode"

  fixed:
    CanControllerActivation: true
    CanBusoffProcessing: "POLLING"
