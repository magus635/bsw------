metadata:
  name: "ADC Single Shot"
  module: "Adc"
  category: "Analog"
  description: "ADC group for single shot conversion, ideal for on-demand measurements"
  version: "1.0"
  author: "AUTOSAR Configurator"
  tags: ["adc", "analog", "single-shot", "on-demand"]

applicability:
  container_def: "AdcConfigSet/AdcHwUnit/AdcGroup"

parameters:
  adjustable:
    - name: "AdcGroupId"
      display_name: "Group ID"
      type: "integer"
      default: 0
      min: 0
      max: 31

    - name: "AdcGroupPriority"
      display_name: "Priority"
      type: "integer"
      default: 0
      min: 0
      max: 7
      description: "Higher value = higher priority"

  fixed:
    AdcGroupConversionMode: "ADC_CONV_MODE_ONESHOT"
    AdcGroupTriggSrc: "ADC_TRIGG_SRC_SW"
    AdcGroupAccessMode: "ADC_ACCESS_MODE_SINGLE"
    AdcStreamingNumSamples: 1
