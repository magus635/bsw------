name: THA610X_LFBGA180
family: THA6
package: LFBGA180
description: "THA610X Series - Entry level automotive MCU"

ports:
  PORT_A:
    - { pin: 0, name: PA0, alternate_functions: [GPIO, ADC0_CH0, TIM0_CH0] }
    - { pin: 1, name: PA1, alternate_functions: [GPIO, ADC0_CH1, TIM0_CH1] }
    - { pin: 2, name: PA2, alternate_functions: [GPIO, ADC0_CH2, TIM0_CH2] }
    - { pin: 3, name: PA3, alternate_functions: [GPIO, ADC0_CH3, TIM0_CH3] }
    - { pin: 4, name: PA4, alternate_functions: [GPIO, SPI0_MOSI] }
    - { pin: 5, name: PA5, alternate_functions: [GPIO, SPI0_MISO] }
    - { pin: 6, name: PA6, alternate_functions: [GPIO, SPI0_SCK] }
    - { pin: 7, name: PA7, alternate_functions: [GPIO, SPI0_CS] }
    - { pin: 8, name: PA8, alternate_functions: [GPIO, UART0_TX] }
    - { pin: 9, name: PA9, alternate_functions: [GPIO, UART0_RX] }
    - { pin: 10, name: PA10, alternate_functions: [GPIO, CAN0_TX] }
    - { pin: 11, name: PA11, alternate_functions: [GPIO, CAN0_RX] }
    - { pin: 12, name: PA12, alternate_functions: [GPIO] }
    - { pin: 13, name: PA13, alternate_functions: [GPIO] }
    - { pin: 14, name: PA14, alternate_functions: [GPIO] }
    - { pin: 15, name: PA15, alternate_functions: [GPIO] }
  PORT_B:
    - { pin: 0, name: PB0, alternate_functions: [GPIO, ADC0_CH4] }
    - { pin: 1, name: PB1, alternate_functions: [GPIO, ADC0_CH5] }
    - { pin: 2, name: PB2, alternate_functions: [GPIO, ADC0_CH6] }
    - { pin: 3, name: PB3, alternate_functions: [GPIO, ADC0_CH7] }
    - { pin: 4, name: PB4, alternate_functions: [GPIO, CAN1_TX] }
    - { pin: 5, name: PB5, alternate_functions: [GPIO, CAN1_RX] }
    - { pin: 6, name: PB6, alternate_functions: [GPIO] }
    - { pin: 7, name: PB7, alternate_functions: [GPIO] }
    - { pin: 8, name: PB8, alternate_functions: [GPIO] }
    - { pin: 9, name: PB9, alternate_functions: [GPIO] }
    - { pin: 10, name: PB10, alternate_functions: [GPIO] }
    - { pin: 11, name: PB11, alternate_functions: [GPIO] }
    - { pin: 12, name: PB12, alternate_functions: [GPIO] }
    - { pin: 13, name: PB13, alternate_functions: [GPIO] }
    - { pin: 14, name: PB14, alternate_functions: [GPIO] }
    - { pin: 15, name: PB15, alternate_functions: [GPIO] }

can_resources:
  - name: CAN0
    controller_id: 0
    max_baudrate: 1000000
    supports_fd: false
    mailbox_count: 32
  - name: CAN1
    controller_id: 1
    max_baudrate: 500000
    supports_fd: false
    mailbox_count: 16

adc_resources:
  - name: ADC0
    unit_id: 0
    channel_count: 8
    resolution_bits: 12
    channels: [0, 1, 2, 3, 4, 5, 6, 7]

spi_resources:
  - name: SPI0
    unit_id: 0
    max_baudrate: 10000000
    supports_dma: true

intc_sources:
  - { name: CAN0_IRQ, vector_number: 32, priority_bits: 4 }
  - { name: CAN1_IRQ, vector_number: 33, priority_bits: 4 }
  - { name: ADC0_IRQ, vector_number: 40, priority_bits: 4 }
  - { name: SPI0_IRQ, vector_number: 48, priority_bits: 4 }
  - { name: TIM0_IRQ, vector_number: 56, priority_bits: 4 }

metadata:
  cpu_frequency: 80000000
  flash_size: 512KB
  ram_size: 64KB
