# Port Module Mapping Rule
# Maps gpio_port resources to Port module configuration

module: "Port"
resource_type: "gpio_port"
description: "Map GPIO ports to Port module configuration"

containers:
  - path_template: "PortConfigSet/PortContainer_{resource.resource_id}"
    parameters:
      - name: "PortNumberOfPortPins"
        source: "resource.properties.pin_count"
        ui_type: "readonly"

    # PortNumber is not written: the Port definition derives it (not editable) from the
    # container's position in Port.AvailablePortsID, the order of the pin table's ports.
    sub_containers:
      # One container per existing pin; a port may have gaps (THA6412 P10 has no pin 12)
      - path_template: "PortPin_{resource.resource_id}_{pin}"
        iterate: "resource.properties.pins"
        iterate_var: "pin"
        parameters:
          - name: "PortPinId"
            transform: "resource.properties.port_index * 16 + pin"
            ui_type: "readonly"

          - name: "PortPinDirection"
            default: "PORT_PIN_IN"
            ui_type: "combo"
            ui_options:
              options:
                - "PORT_PIN_IN"
                - "PORT_PIN_OUT"
                - "PORT_PIN_INOUT"

          - name: "PortPinLevelValue"
            default: "PORT_PIN_LEVEL_LOW"
            ui_type: "combo"
            ui_options:
              options:
                - "PORT_PIN_LEVEL_LOW"
                - "PORT_PIN_LEVEL_HIGH"

ui_config:
  title: "GPIO Ports"
  layout: "list_with_options"
  list_field: "resource"
