#####################################################################################################
# Total number of cores
OsResource.NumOfCores: 1

OsResource.AvailableCores: CORE0
# Modules that allow multi-core allocation
OsResource.MultiCoreModules: ADC,PWM,GPT,CAN,SPI,ETH,LIN,ICU,OCU,UART,MSC,DMA,IOM,SENT,DSADC,I2C
# Master core
OsResource.MasterCore: OS_CORE_ID_0
# Processor supported by this resource porperties file
OsResource.SupportProcessor: SC300

