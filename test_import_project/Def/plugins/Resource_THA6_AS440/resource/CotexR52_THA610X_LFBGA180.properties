Intc.CoreFixedIntClass: GIC_SGI, GIC_PPI, INTC_SOFTINT

# Interrupt IDs used by MCAL module 
# Interrupt classification
#   Intc.IntSrcClass: <ModuleNames>
#     - <ModuleNames>: Module name with configured interrupts
#
# Interrupt detail configuration information
#   Intc.<ModuleName>.SubClassName: <SubClassIntNames>
#     - <ModuleName>: Module name
#     - <SubClassIntNames>: Names of the configurable interrupts under this module
#   Intc.<ModuleName>.<SubClassIntName>.IntName: <IntNames>
#     - <ModuleName>: Module name
#     - <SubClassIntName>: Name of the configurable interrupts under this sub classification
#     - <IntNames>: Names of the configurable interrupts under this sub classification
#   Intc.<ModuleName>.<SubClassIntName>.IntID: <IntIDs>
#     - <ModuleName>: Module name
#     - <SubClassIntName>: Name of the configurable interrupts under this sub classification
#     - <IntIDs>: IDs of the configurable interrupts under this sub classification
#   Intc.<ModuleName>.<SubClassIntName>.IntTrigMthd: <IntTrigMthds>
#     - <ModuleName>: Module name
#     - <SubClassIntName>: Name of the configurable interrupts under this sub classification
#     - <IntTrigMthds>: Interrupt trigger methods of the configurable interrupts under this sub classification

