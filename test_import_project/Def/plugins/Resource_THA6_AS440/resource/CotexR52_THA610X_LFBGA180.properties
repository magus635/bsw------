#####################################################################################################
##                                          Resource module                                        ##
#####################################################################################################
# Total number of cores
Resource.NumOfCores: 2
Resource.AvailableCores: CORE0, CORE1
# Cluster classification
Resource.Cluster.TotalNum: 2
Resource.Clsuter.C0.Cores: CORE0, CORE1
# Modules that allow multi-core allocation
Resource.MultiCoreModules: ADC,PWM,GPT,CAN,SPI,ETH,LIN,ICU,OCU,UART,MSC,DMA,IOM,SENT,DSADC,I2C
# Master core
Resource.MasterCore: CORE0, CORE1
# Processor supported by this resource porperties file
Resource.SupportProcessor: THA6206_LFBGA292, THA6412_BGA516, THA610X_LFBGA180

#####################################################################################################
##                                            Adc module                                           ##
#####################################################################################################
Adc.MaxControllers: 10

# Supported ADC HW unit
Adc.HwUnitId: SARADC0, SARADC1, SARADC2, SARADC3

# Synchronization group
# Finf the Sync group though the HW unit number
Adc.SyncGroup.SARADC0: Adc.SyncGroupA
Adc.SyncGroup.SARADC1: Adc.SyncGroupA
Adc.SyncGroup.SARADC2: Adc.SyncGroupA
Adc.SyncGroup.SARADC3: Adc.SyncGroupA

# Find the HW units though the sync group
Adc.SyncGroupA: SARADC0, SARADC1, SARADC2, SARADC3

# Synchronization group mapping relationship
# Master HW unit: Register setting values(HW unit0, HW unit1, HW unit2, HWunit3)
Adc.SyncGroup.Master.SARADC0: 0, 1, 2, 2
Adc.SyncGroup.Master.SARADC1: 1, 0, 3, 3
Adc.SyncGroup.Master.SARADC2: 2, 2, 0, 1
Adc.SyncGroup.Master.SARADC3: 3, 3, 1, 0

# All supported resolutions
Adc.Resolution: BITS_12, BITS_10, BITS_8 
# Max resolution
Adc.MaxResolution: 12
# Resolution is availabled for channel or HW unit:
# true: for each channel
# false: only for HW unit(All channels share a common resolution)
Adc.ResolutionForChannel: false

# Supported reference high voltages
Adc.RefVoltSrcHigh: REF_VOLTAGE_VAREF
# Supported reference low voltages
Adc.RefVoltSrcLow: REF_VOLTAGE_GND
# Reference voltage is availabled for channel or HW unit:
# true: for each channel
# false: only for HW unit(All channels share a common resolution)
Adc.RefVoltForChannel: false

# Number of ADC request queue
Adc.ReqSrcCount: 3
Adc.ReqSrcClass: REQUESTSOURCE_QUEUE0, REQUESTSOURCE_QUEUE1, REQUESTSOURCE_QUEUE2

# Adc published information for AUTOSAR v4.2.2
Adc.ChannelValueSigned: false
Adc.GroupFirstChannelFixed: false

# Priority of request queue source
Adc.RequestSrcPrio: LOWEST, LOW, HIGH, HIGHEST

# Calibration enable on startup
Adc.StartUpCalEn: true

# Adc available working clock range
Adc.AnalogClockMinMHz: 0.23
Adc.AnalogClockMaxMHz: 14.28

# Number of Adc sampling-conversion clocks
Adc.SampleTimeRange: 0, 255
# Conversion time is availabled for channel or HW unit:
# true: for each channel
# false: only for HW unit(All channels share a common conversion time)
Adc.ConvTimeForChannel: false

# Channel of each ADC HW unit
Adc.AdcChannels_Adc0: AN0,AN1,AN2,AN3,AN4,AN5,AN6,AN7,P02_1,P02_2,P02_3,P02_4,P00_10,P00_11,P41_0,P14_1
Adc.AdcChannels_Adc1: AN8,AN9,AN10,AN11,AN12,AN13,AN14,AN15,P02_5,P02_6,P02_7,P02_8,P41_2,P41_3,P41_4,P14_1
Adc.AdcChannels_Adc2: AN32_P40_4,AN33_P40_5,AN34,AN35,AN36_P40_6,AN37_P40_7,AN38_P40_8,AN39_P40_9,AN4,AN5,AN6,AN7,AN8,AN9,AN10,AN11
Adc.AdcChannels_Adc3: P00_12,P34_1,P34_2,P00_9,P00_8,P00_7,P00_6,P00_5,P00_4,P00_3,P00_2,P00_1,P41_6,P41_7,P41_8,P41_9

# All channels of ADC HW unit
Adc.AdcChannels_Adcx: AN0,AN1,AN2,AN3,AN4,AN5,AN6,AN7,P02_1,P02_2,P02_3,P02_4,P00_10,P00_11,P41_0, \
                       AN8,AN9,AN10,AN11,AN12,AN13,AN14,AN15,P02_5,P02_6,P02_7,P02_8,P41_2,P41_3,P41_4,P14_1, \
                       AN32_P40_4,AN33_P40_5,AN34,AN35,AN36_P40_6,AN37_P40_7,AN38_P40_8,AN39_P40_9, \
                       P00_12,P34_1,P34_2,P00_9,P00_8,P00_7,P00_6,P00_5,P00_4,P00_3,P00_2,P00_1,P41_6,P41_7,P41_8,P41_9

# ADC hardware trigger mode 
Adc.ExtTrigSignals: GTM_TRIGGER0,GTM_TRIGGER1,GTM_TRIGGER2,GTM_TRIGGER3,GTM_TRIGGER4


#####################################################################################################
##                                            Can module                                           ##
#####################################################################################################
# Maximum CAN module.
Can.MaxModules: 2
# Maximum CAN nodes per moudle.
Can.MaxNodes: 3
# Maximum Hardware objects.
Can.MaxHwObjects: 512
# MCAN0(module) register start address.
Can.MCAN0: 0xC0090000
# MCAN1(module) register start address.
Can.MCAN1: 0xD0000000
# MCAN0/1(module) message ram start-end address.
# MCAN0(module) share 32KB,MCAN1(module) share 16KB Message RAM respectively
Can.MCAN0BASERAM: 0xC0098000
Can.MCAN1BASERAM: 0xD0008000
Can.MCAN0ENDRAM: 0xC009FFFF
Can.MCAN1ENDRAM: 0xD000BFFF
# Supported CAN HW Node
Can.HwUnitNode: CAN_CONTROLLER_00, CAN_CONTROLLER_01, CAN_CONTROLLER_02, \
                CAN_CONTROLLER_10, CAN_CONTROLLER_11, CAN_CONTROLLER_12
# Controller (node) register start address.
Can.Node00BaseAddress:0xC0090000
Can.Node01BaseAddress:0xC0091800
Can.Node02BaseAddress:0xC0093000
Can.Node10BaseAddress:0xD0000000
Can.Node11BaseAddress:0xD0001800
Can.Node12BaseAddress:0xD0003000

#####################################################################################################
##                                            FLS module                                           ##
#####################################################################################################
# Start Address for Fls Driver. Base on User DFLASH at 0x94000000.
Fls.BaseAddress:2483027968
Fls.PFlashBaseAddress:2420113408
# Fls Driver Total Size in bytes. Base on User DFLASH Size as 256K.
Fls.TotalSize:262144
Fls.PFlashTotalSize:4194304
#Fls.EraseSuspend:true
# Maximum time to erase one complete flash sector(usec).
Fls.EraseTime:110000
# Maximum time to program one complete flash page(usec).
Fls.WriteTime:10000
#Fls.WaitStateRead:FLS_WAIT_STATE_READACCESS9
#Fls.WaitStateErrorCorrection:FLS_WAIT_STATE_ERRORCORRECTION1
# A flash sector is the smallest amount of flash memory that can be erased in one pass.
Fls.SectorSize:1024
Fls.PFlashSectorSize:8192
# A flash page is the smallest amount of flash memory that can be programmed in one pass.
Fls.PageSize:16
Fls.PFlashPageSize:64
Fls.SectorNum:256
Fls.PFlashSectorNum:512
Fls.PFlashVirtualBaseAddress:268435456
# Pflash: virtual base address + total size - 1U
Fls.PFlashVirtualEndAddress:272629759
Fls.DFlashRowSize:512
Fls.PFlashRowSize:2048

